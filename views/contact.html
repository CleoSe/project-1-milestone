    <body>
        <div class = "container">
            <a href = "home.html">
                <img src = "../images/SL_Logo.jpg" width = "200" height = "150" class = "position-absolute top-0 start-0">
            </a>
            <p class = "pe-5 py-3 text-end fs-4 fw-medium">

            </p>
            <p class = "pe-2 py-auto text-end fs-4 fw-medium">
                Phone Number: 765-282-1020
            </p>
        </div>
        <div class="container-fluid py-3">
            <table>
                <th><a class = "nav-link" href = home.html>Home</a></th>
                <th><a class = "nav-link" href = services.html>Services</a></th>
                <th><a class = "nav-link" href = contact.html style="color: red;">Contact</a></th>
                <th><a class = "nav-link" href = resources.html>Resources</a></th>

        <!-- Contact Form -->
        <div class="container my-5">
            <h2 class="text-center mb-4">Contact Us</h2>
            <div class="mx-auto w-75 p-4 border rounded" style="background-color: red;">
                <form action="#" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="First Name*">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="Last Name*">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" placeholder="Street, City, State">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="6" placeholder="How can we help?"></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="sumbitForm" class="form-control mb-1" style="background-color: lightgrey; color: black; outline-color: lightgrey; padding: 12px;">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
