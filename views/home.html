    <script>

        //array for reviews

        const reviews = 
        [
            "Came out the day I called, in freezing temperature, to fix my door so I could get me car out of the garage - Linda ",
            "They responded very quickly and got our broken spring repaired as quickly as they could. Very professional and fairly priced. I would definitely recommend their services! - Matt",
            "Steve does a fantastic job. We have purchased two doors which he installed. He's quick, efficient,  and affordable.  Look no further for your garage door needs. - Bobby"
        ]

        let reviewsText = document.getElementById("reviews");
        let i = 0
        reviewsText.innerText = reviews[i];

        function nextReview(){
            i++;
            if (i > (reviews.length - 1)){
                i = 0;
                reviewsText.innerText = reviews[i];
            } else{
                reviewsText.innerText = reviews[i];

            }

        }

        function prevReview(){
            i--;
            if (i < 0){
                i = (reviews.length - 1);
                reviewsText.innerText = reviews[i];
            } else {
                reviewsText.innerText = reviews[i];
            }
        }

        function showContact(){
            const form = document.getElementById("contactForm");
            const arrow = document.getElementById("arrow");
            form.classList.toggle("active");
            arrow.classList.toggle("rotate-180");
        }
        
        //script for reviews box
        //add button to go to next review
        //should be an arrow that scrolls to the next review
    </script>
